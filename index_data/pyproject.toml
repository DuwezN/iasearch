[project]
name = "index-data"
version = "0.1.0"
description = "Pipeline d'indexation, embeddings et clustering du projet IA Search"
readme = "README.md"
authors = [
    { name = "Nicolas Duwez" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
index-data = "index_data:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
